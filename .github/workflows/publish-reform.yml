name: Publish Reform

# Triggered by the CRM publication router (workflow_dispatch) once a human
# approves adding a scored reform to the bill tracker. Computes impacts from
# the validated reform_dict, upserts research + reform_impacts to Supabase as
# in_review (hidden on the site), and opens a bill-review PR — merging that PR
# fires publish-bill.yml, which flips the entry to published and redeploys.
#
# STATE-LEVEL ONLY: federal reforms need the national (populace-us) dataset,
# which exceeds GitHub-hosted runner memory (verified 2026-07-13: OOM-killed
# a 16GB runner even with 24GB swap). Compute federal reforms locally and
# publish via publish-analysis.yml; the CRM router sends federal reforms to
# the dashboard route instead.
on:
  workflow_dispatch:
    inputs:
      id:
        description: 'Reform slug, e.g. "us-ctc-restoration-2026" (lowercase, [a-z0-9-])'
        required: true
        type: string
      state:
        description: '"us" for federal, or a 2-letter state code (e.g. "ut")'
        required: true
        default: 'us'
        type: string
      label:
        description: 'Short display label (≤60 chars)'
        required: true
        type: string
      reform_json:
        description: 'Validated reform_dict JSON (param path → {date_range: value}), from /analyze-policy'
        required: true
        type: string
      baseline_json:
        description: 'Optional baseline override (same JSON shape). For ENACTED bills already in the policyengine-us baseline: set this to the prior-law counterfactual and reform_json to the bill, so impacts carry the bill''s true effect and signs.'
        required: false
        default: ''
        type: string
      title:
        description: 'Research entry title'
        required: true
        type: string
      description:
        description: 'One-paragraph neutral provisions summary'
        required: false
        default: ''
        type: string
      tags:
        description: 'Comma-separated lowercase tags, e.g. "federal,child-tax-credit"'
        required: false
        default: ''
        type: string
      source_url:
        description: 'Primary source URL (bill page, news article)'
        required: false
        default: ''
        type: string
      review_notes:
        description: 'Markdown appended to the bill-review PR body: the decision log (baseline framing, scope, routing) and validation record (verdict, benchmark table, dry-run link, known limitations). Reviewers should be able to approve from the PR alone.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Compute + validate only: no Supabase write, no PR'
        required: false
        default: false
        type: boolean

jobs:
  publish-reform:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # microsim + dataset download dominate
    permissions:
      contents: write        # push the bill/{id} branch
      pull-requests: write   # open the bill-review PR
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # policyengine-us-data pins an old policyengine-us (currently ==1.693.5),
        # which predates recently-added state parameters (e.g. GA HB463's
        # flat_rate). Install data first, then upgrade the model — the same
        # current-model pairing the hosted API scores against.
        run: |
          pip install policyengine-us-data supabase numpy pyyaml python-dotenv huggingface_hub
          pip install --upgrade policyengine-us
          python -c 'from importlib.metadata import version; print("model", version("policyengine-us"), "/ data", version("policyengine-us-data"))'

      - name: Add swap
        # The national (populace-us) microsim peaks above the 16GB hosted-runner
        # RAM — the runner cancels the step without swap. /mnt has ~60GB free.
        run: |
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build reform config
        # Inputs come in via env (never inline ${{ }} into shell/python) and are
        # validated here: id must be a safe slug (it becomes a file path and a
        # branch name), reform_json must parse as a JSON object.
        env:
          REFORM_ID: ${{ inputs.id }}
          REFORM_STATE: ${{ inputs.state }}
          REFORM_LABEL: ${{ inputs.label }}
          REFORM_JSON: ${{ inputs.reform_json }}
          BASELINE_JSON: ${{ inputs.baseline_json }}
        run: |
          python3 - << 'EOF'
          import json, os, re, sys
          reform_id = os.environ["REFORM_ID"]
          state = os.environ["REFORM_STATE"].strip().lower()
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", reform_id):
              sys.exit(f"id {reform_id!r} must match ^[a-z0-9][a-z0-9-]*$")
          if not re.fullmatch(r"[a-z]{2}", state):
              sys.exit(f"state {state!r} must be 'us' or a 2-letter state code")
          reform = json.loads(os.environ["REFORM_JSON"])
          if not isinstance(reform, dict) or not reform:
              sys.exit("reform_json must be a non-empty JSON object")
          baseline_raw = os.environ.get("BASELINE_JSON", "").strip()
          baseline = None
          if baseline_raw:
              baseline = json.loads(baseline_raw)
              if not isinstance(baseline, dict) or not baseline:
                  sys.exit("baseline_json, when set, must be a non-empty JSON object")
          config = {
              "id": reform_id,
              "state": state,
              "label": os.environ["REFORM_LABEL"],
              "reform": reform,
              "baseline": baseline,
          }
          with open("/tmp/reform-config.json", "w") as f:
              json.dump(config, f, indent=2)
          print(json.dumps(config, indent=2))
          EOF

      - name: Compute impacts
        env:
          # State datasets (states/XX.h5) and populace-us come from the
          # policyengine/policyengine-us-data HF repo; token needed if gated.
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
          REFORM_ID: ${{ inputs.id }}
        run: |
          python scripts/compute_impacts.py \
            --reform-json /tmp/reform-config.json \
            --output "analyses/${REFORM_ID}.json"

      - name: Merge research metadata
        env:
          REFORM_ID: ${{ inputs.id }}
          REFORM_STATE: ${{ inputs.state }}
          REFORM_TITLE: ${{ inputs.title }}
          REFORM_DESCRIPTION: ${{ inputs.description }}
          REFORM_TAGS: ${{ inputs.tags }}
          REFORM_SOURCE_URL: ${{ inputs.source_url }}
        run: python scripts/merge_research_metadata.py "analyses/${REFORM_ID}.json"

      - name: Upload analysis to Supabase (in_review)
        if: inputs.dry_run == false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          REFORM_ID: ${{ inputs.id }}
        run: python scripts/publish_analysis.py "analyses/${REFORM_ID}.json"

      - name: Validate artifact (dry run)
        if: inputs.dry_run == true
        env:
          REFORM_ID: ${{ inputs.id }}
        run: python scripts/publish_analysis.py "analyses/${REFORM_ID}.json" --dry-run

      - name: Open bill-review PR
        if: inputs.dry_run == false
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REFORM_ID: ${{ inputs.id }}
          REFORM_TITLE: ${{ inputs.title }}
          REVIEW_NOTES: ${{ inputs.review_notes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="bill/${REFORM_ID}"
          git checkout -b "$BRANCH"
          git add "analyses/${REFORM_ID}.json"
          git commit -m "Add scored reform: ${REFORM_ID}"
          git push -u origin "$BRANCH" --force
          # Assemble the PR body: standard header + computed headline numbers
          # from the artifact + the caller's decision/validation record.
          python3 - << 'EOF'
          import json, os
          reform_id = os.environ["REFORM_ID"]
          with open(f"analyses/{reform_id}.json") as f:
              a = json.load(f)
          budget = a.get("reform_impacts", {}).get("budgetary_impact") or {}
          rev = budget.get("stateRevenueImpact")
          rev_line = f"2026 state revenue impact: **${rev:,.0f}**" if isinstance(rev, (int, float)) else ""
          body = f"""Automated publication from the reform-scoring pipeline.

          The reform's impacts were computed by [this workflow run]({os.environ['RUN_URL']}) and upserted to Supabase as `in_review` (hidden on the site). **Merging this PR publishes the entry** on the bill tracker (publish-bill.yml flips status to published and redeploys Modal).

          Artifact: `analyses/{reform_id}.json`
          {rev_line}

          {os.environ.get('REVIEW_NOTES', '').strip() or '_No review notes provided — the dispatching pipeline should pass the decision log and validation record via the `review_notes` input._'}

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"""
          # De-indent the literal block above
          body = "\n".join(line[10:] if line.startswith(" " * 10) else line for line in body.splitlines())
          with open("/tmp/pr-body.md", "w") as f:
              f.write(body)
          EOF
          PR_URL=$(gh pr create \
            --title "Publish reform: ${REFORM_TITLE}" \
            --label bill-review \
            --body-file /tmp/pr-body.md \
            --head "$BRANCH" --base main)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened $PR_URL"

      - name: Write publication result
        # Normalized cross-repo contract consumed by the CRM publication
        # tracker: publication-result artifact containing result.json.
        if: always()
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          python3 -c "import json, os; json.dump({'pr_url': os.environ.get('PR_URL') or None}, open('/tmp/result.json', 'w'))"
          cat /tmp/result.json

      - name: Upload publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-result
          path: |
            /tmp/result.json
            analyses/*.json
          if-no-files-found: warn
          retention-days: 30
